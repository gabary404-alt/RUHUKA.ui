name: School release checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/backend-attendance-guards]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/*.test.js
      - run: node scripts/build-public-site.cjs
      - run: node scripts/check-release.cjs
